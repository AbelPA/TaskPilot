name: CI

on:
  push:
    branches: [main, release/extrator_audio_video]
  pull_request:
    branches: [main, release/extrator_audio_video]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install --global npm@11.4.2
      - run: npm ci
        working-directory: apps/web
      - run: npm test -- --watch=false
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test apps/api.tests/AudioApi.Tests.csproj

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.17
      - run: uv sync --locked --directory apps/workers/audio
      - run: uv run --directory apps/workers/audio pytest

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.17
      - run: uv sync --locked --directory apps/workers/audio
      - run: uv run --project apps/workers/audio openapi-spec-validator specs/002-youtube-audio-extraction/contracts/audio-extractions.openapi.yaml
