[project]
name = "taskpilot-audio-worker"
version = "0.1.0"
description = "Background worker for TaskPilot audio extraction"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aio-pika>=9.5,<10",
    "jsonschema>=4.23,<5",
    "openapi-spec-validator>=0.7,<1",
    "yt-dlp>=2025.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_worker"]
